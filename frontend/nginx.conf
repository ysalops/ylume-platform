server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Nunca deixe dotfiles/segredos virarem fallback da SPA.
    location ~ /\.(?!well-known).* {
        return 404;
    }

    # Tipos de arquivo comuns em probes automatizados não fazem parte da Ylume.
    location ~* \.(?:php|asp|aspx|cgi)$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|jpg|jpeg|png|gif|svg|ico|webp|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
