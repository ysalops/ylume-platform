name: ylume-production

services:
  traefik:
    image: traefik:v3
    container_name: ylume-traefik
    restart: unless-stopped

    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false

      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443

      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https

      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web

      - --log.level=INFO
      - --accesslog=true

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ylume_letsencrypt:/letsencrypt

    networks:
      - proxy

    mem_limit: 160m


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://${API_DOMAIN}

    container_name: ylume-frontend
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    labels:
      - traefik.enable=true
      - traefik.http.routers.ylume-frontend.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.ylume-frontend.entrypoints=websecure
      - traefik.http.routers.ylume-frontend.tls=true
      - traefik.http.routers.ylume-frontend.tls.certresolver=letsencrypt
      - traefik.http.services.ylume-frontend.loadbalancer.server.port=80

      - traefik.http.middlewares.ylume-security.headers.contentTypeNosniff=true
      - traefik.http.middlewares.ylume-security.headers.frameDeny=true
      - traefik.http.middlewares.ylume-security.headers.referrerPolicy=no-referrer
      - traefik.http.middlewares.ylume-security.headers.stsSeconds=31536000
      - traefik.http.middlewares.ylume-security.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.ylume-security.headers.stsPreload=true
      - traefik.http.routers.ylume-frontend.middlewares=ylume-security

    networks:
      - proxy

    mem_limit: 192m


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: ylume-backend
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      N8N_WEBHOOK_URL: http://n8n:5678/webhook/ylume-structure
      N8N_TIMEOUT_SECONDS: ${N8N_TIMEOUT_SECONDS:-180}

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-ylume_session}
      AUTH_COOKIE_SECURE: "true"

      FRONTEND_ORIGINS: https://${APP_DOMAIN}
      ALLOW_LOCAL_PROJECT_CLAIM: "false"

      TZ: America/Sao_Paulo

    depends_on:
      postgres:
        condition: service_healthy
      n8n:
        condition: service_started

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"
        ]
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 20s

    labels:
      - traefik.enable=true
      - traefik.http.routers.ylume-api.rule=Host(`${API_DOMAIN}`)
      - traefik.http.routers.ylume-api.entrypoints=websecure
      - traefik.http.routers.ylume-api.tls=true
      - traefik.http.routers.ylume-api.tls.certresolver=letsencrypt
      - traefik.http.services.ylume-api.loadbalancer.server.port=8001

    networks:
      - proxy
      - internal

    mem_limit: 896m


  n8n:
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:latest}
    container_name: ylume-n8n
    restart: unless-stopped

    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      N8N_HOST: ${N8N_DOMAIN}
      N8N_PORT: 5678
      N8N_PROTOCOL: https

      WEBHOOK_URL: https://${N8N_DOMAIN}/
      N8N_EDITOR_BASE_URL: https://${N8N_DOMAIN}/
      N8N_SECURE_COOKIE: "true"

      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo

    volumes:
      - ylume_n8n_data:/home/node/.n8n

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5678/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 30s

    labels:
      - traefik.enable=true
      - traefik.http.routers.ylume-n8n.rule=Host(`${N8N_DOMAIN}`)
      - traefik.http.routers.ylume-n8n.entrypoints=websecure
      - traefik.http.routers.ylume-n8n.tls=true
      - traefik.http.routers.ylume-n8n.tls.certresolver=letsencrypt
      - traefik.http.services.ylume-n8n.loadbalancer.server.port=5678

    networks:
      - proxy
      - internal

    mem_limit: 1100m


  postgres:
    image: postgres:17-alpine
    container_name: ylume-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      N8N_DB: ${N8N_DB}

      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo

    volumes:
      - ylume_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - internal

    mem_limit: 768m


networks:
  proxy:
    name: ylume-proxy

  internal:
    name: ylume-internal
    internal: true


volumes:
  ylume_postgres_data:
    name: ylume-postgres-data

  ylume_n8n_data:
    name: ylume-n8n-data

  ylume_letsencrypt:
    name: ylume-letsencrypt
